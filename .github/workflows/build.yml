name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install MC Pilot without global setup scripts
        run: npm ci --ignore-scripts

      - name: Validate harness and resources
        run: node harness/cli.mjs validate --static

      - name: Exercise development orchestration
        run: node harness/cli.mjs develop --dry-run

      - name: Build with Gradle
        run: ./gradlew build
